name: Close issues on dev

# GitHub only closes issues from "Closes #N" when a commit reaches the default
# branch (main). Pull requests merge into dev, so this closes the issue as soon
# as the squash commit that references it lands there.

on:
  push:
    branches: [dev]

permissions:
  contents: read
  issues: write

jobs:
  close:
    name: Close referenced issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close issues named in pushed commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # One line per commit: id, subject (first line), and the whole message flattened.
          jq -r '.commits[] | [.id, (.message | split("\n")[0]), (.message | gsub("\n"; " "))] | @tsv' "$GITHUB_EVENT_PATH" |
          while IFS=$'\t' read -r sha subject message; do
            numbers=$(printf '%s\n' "$message" \
              | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
              | grep -oE '[0-9]+$' | sort -u || true)
            for number in $numbers; do
              # Skip pull requests, missing numbers and issues that are already closed.
              state=$(gh api "repos/$GH_REPO/issues/$number" --jq 'if .pull_request then "PR" else .state end' 2>/dev/null || echo "missing")
              if [ "$state" != "open" ]; then
                echo "#$number: $state, skipped"
                continue
              fi
              gh issue close "$number" --comment "Merged into \`dev\` in $sha: $subject"
              echo "#$number: closed"
            done
          done
