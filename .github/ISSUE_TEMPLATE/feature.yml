name: Feature
description: New behaviour for users or developers
title: "Commons: <Subdomain>: <what changes>"
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Who needs this and why, in two or three sentences.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable outcomes, one per line.
      value: |
        - [ ] 
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Requirements
      description: PRD requirement IDs this covers, if any (for example FR-1, NFR-2).
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Design decisions, risks, permissions, migrations, links.
